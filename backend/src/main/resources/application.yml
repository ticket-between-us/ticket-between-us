spring:
  application:
    name: ticket-between-us
  datasource:
    # 로컬 기본값은 docker-compose.yml / .env.example 과 맞춰 두었습니다. 운영 값은 SSM Parameter Store에서 주입합니다 (NFR-09).
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 마이그레이션으로만 관리합니다 (명세서 12.2)
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
